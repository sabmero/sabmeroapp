name: Build signed AAB (Play Store)
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (versionCode). Must be higher than the one on Play Console (now 4). Example: 5"
        required: true
        default: "5"
      build_name:
        description: "Version name shown to users. Example: 1.0.4"
        required: false
        default: ""
concurrency:
  group: build-aab
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "A signing secret is missing - stopping so the AAB is not signed with the debug key"
            exit 1
          fi
          # remove stray spaces / new lines that get added when pasting on a phone
          STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n')
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/upload-keystore.jks
          echo "Checking keystore with the saved password and alias..."
          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "ERROR: keystore, KEYSTORE_PASSWORD or KEY_ALIAS secret is wrong. Re-create these secrets."
            keytool -list -keystore android/app/upload-keystore.jks -storepass "$STORE_PASS" 2>&1 | head -5 || true
            exit 1
          fi
          echo "Keystore OK"
          # PKCS12 keystores use the store password for the key as well
          {
            echo "storePassword=$STORE_PASS"
            echo "keyPassword=$STORE_PASS"
            echo "keyAlias=$ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter pub get

      - name: Build AAB
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          set -e
          ARGS="--release --build-number=$BUILD_NUMBER"
          if [ -n "$BUILD_NAME" ]; then ARGS="$ARGS --build-name=$BUILD_NAME"; fi
          flutter build appbundle $ARGS

      - name: Show which key signed it
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256" || true

      - run: cp build/app/outputs/bundle/release/app-release.aab sabmero-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: sabmero-aab
          path: sabmero-release.aab

      - name: Publish AAB as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-aab --yes --cleanup-tag || true
          gh release create latest-aab sabmero-release.aab --title "Latest signed AAB" \
            --notes "Build number ${{ inputs.build_number }} from ${GITHUB_SHA::7}" --prerelease
