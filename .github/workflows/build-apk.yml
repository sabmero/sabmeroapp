name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: cp build/app/outputs/flutter-apk/app-debug.apk sabmero.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sabmero-apk
          path: sabmero.apk
      - name: Publish latest APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sabmero.apk --title "Latest APK" \
            --notes "Built from ${GITHUB_SHA::7}" --prerelease
